name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check --fix src tests scripts
          ruff check src tests scripts
      - name: Test
        run: pytest -q
      - name: Compile
        run: python -m compileall -q src scripts
      - name: Import smoke test
        run: python -c "from chatv1.engine import ChatEngine; from chatv1.retrieval import LexicalRetriever; from chatv1.conversation_sqlite import SQLiteConversationStore; print('ChatV1 smoke imports OK')"

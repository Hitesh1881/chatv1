[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chatv1"
version = "0.1.0"
description = "Original, testable AI research system"
requires-python = ">=3.11"
dependencies = ["torch>=2.4"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]
image = ["diffusers>=0.35", "transformers>=4.45", "safetensors>=0.4", "Pillow>=10.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-ignore = ["BLE001"]

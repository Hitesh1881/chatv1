<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChatV1 Demo</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#0d0f12;color:#eee}.app{max-width:1050px;margin:auto;padding:24px}.tabs{display:flex;gap:8px;margin:20px 0}.tabs button{padding:10px 16px;border:1px solid #333;border-radius:9px;background:#171a1f;color:#ddd;cursor:pointer}.tabs button.active{background:#fff;color:#111}.panel{display:none}.panel.active{display:block}.box{background:#15181d;border:1px solid #292d33;border-radius:14px;padding:18px}.messages{min-height:330px;max-height:520px;overflow:auto;padding:8px}.msg{padding:12px 14px;border-radius:12px;margin:8px 0;max-width:80%;white-space:pre-wrap}.user{margin-left:auto;background:#303640}.assistant{background:#1c2026}.composer{display:flex;gap:8px;margin-top:12px}.composer input{flex:1;padding:12px;border-radius:10px;border:1px solid #444;background:#0f1114;color:#fff}.composer button,.generate{padding:12px 18px;border:0;border-radius:10px;cursor:pointer}.image-form{display:grid;gap:10px}.image-form textarea{min-height:120px;resize:vertical;padding:12px;background:#0f1114;color:#fff;border:1px solid #444;border-radius:10px}.controls{display:flex;gap:8px}.controls input{width:120px;padding:9px;background:#0f1114;color:#fff;border:1px solid #444;border-radius:8px}.status{color:#aaa;margin:12px 0}#imageResult{max-width:100%;border-radius:14px}button:disabled{opacity:.5}</style></head><body><main class="app"><h1>ChatV1</h1><p>AI chat + local image generation research demo</p><div class="tabs"><button class="active" data-tab="chat">Chat</button><button data-tab="image">Image Lab</button></div><section id="chat" class="panel active"><div class="box"><div id="messages" class="messages"><div class="msg assistant">ChatV1 demo ready.</div></div><div class="composer"><input id="chatInput" placeholder="Type a message..."><button id="send">Send</button></div></div></section><section id="image" class="panel"><div class="box image-form"><textarea id="prompt" placeholder="Describe the image..."></textarea><div class="controls"><input id="width" type="number" value="512"><input id="height" type="number" value="512"><input id="steps" type="number" value="20"></div><button class="generate" id="generate">Generate Image</button><div id="status" class="status"></div><img id="imageResult" hidden alt="Generated image"></div></section></main><script>document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});const messages=document.querySelector('#messages'),input=document.querySelector('#chatInput');function add(text,role){const d=document.createElement('div');d.className='msg '+role;d.textContent=text;messages.appendChild(d);messages.scrollTop=messages.scrollHeight}async function send(){const v=input.value.trim();if(!v)return;add(v,'user');input.value='';try{const r=await fetch('http://127.0.0.1:8001/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversation_id:'presentation-demo',prompt:v})});const d=await r.json();if(!r.ok)throw Error(d.message||d.error||'Chat failed');add(d.text||'(empty response)','assistant')}catch(e){add('Error: '+e.message,'assistant')}}document.querySelector('#send').onclick=send;input.onkeydown=e=>{if(e.key==='Enter')send()};document.querySelector('#generate').onclick=async()=>{const prompt=document.querySelector('#prompt').value.trim(),button=document.querySelector('#generate'),status=document.querySelector('#status'),img=document.querySelector('#imageResult');if(!prompt){status.textContent='Enter a prompt first.';return}button.disabled=true;img.hidden=true;status.textContent='Generating...';try{const r=await fetch('http://127.0.0.1:8000/v1/images/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,width:+width.value,height:+height.value,steps:+steps.value})});const d=await r.json();if(!r.ok)throw Error(d.message||d.error||'Generation failed');img.src='data:'+d.mime_type+';base64,'+d.image_base64;img.hidden=false;status.textContent='Generated successfully.'}catch(e){status.textContent='Error: '+e.message}finally{button.disabled=false}};</script></body></html>
